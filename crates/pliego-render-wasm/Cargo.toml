[package]
name = "pliego-render-wasm"
version = "0.1.0"
description = "Puente WebAssembly de pliego-render para la versión web de Pliego"
authors = ["RaulLzn"]
license = "MIT"
repository = "https://github.com/RaulLzn/pliego"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pliego-render = { path = "../pliego-render" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
