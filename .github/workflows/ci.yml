name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/pliego-render-wasm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Markdown renderer for the web
        run: npm run build:wasm

      - name: Test frontend logic
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Build web app (PWA)
        run: npx vite build --mode web

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/pliego-render-wasm/Cargo.toml --all -- --check

      - name: Lint Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/pliego-render-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Test Rust
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path crates/pliego-render/Cargo.toml
